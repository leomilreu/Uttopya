<style>
:root {
  --bg: #faf8f4;
  --orange: #fa671e;
  --logo: clamp(260px, 46vw, 680px);
}
@media (max-width: 600px) {
  :root { --logo: 78vw; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(var(--logo) * 0.07);
  padding: 0 16px;
  background: var(--bg);
  color: var(--orange);
}
h1 { margin: 0; line-height: 0; }
h1 img { display: block; width: var(--logo); height: auto; }
nav { display: flex; gap: 4px; }
nav a {
  --size: max(36px, calc(var(--logo) * 0.078));
  display: grid;
  place-items: center;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: var(--orange);
  color: var(--bg);
  transition: transform .15s ease, opacity .15s ease;
}
nav a:hover { transform: translateY(-2px); opacity: .88; }
nav a:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
nav svg { width: 50%; height: 50%; fill: currentColor; }
@media (prefers-reduced-motion: reduce) {
  nav a { transition: none; }
}
</style>
