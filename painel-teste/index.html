<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}</style>
<title>Painel Uttopya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200..700&family=Roboto:wght@700&display=swap">
<style>
/* Conceito: painel de mesa Uttopya One. Um "palco" com a proporção do celular deitado (20:9)
   escala tudo junto (--k = 1% da altura do palco), então o layout é igual no Redmi e no monitor.
   Card de hora e clima no padrão do Uttopya TV; música compacta; cinco anéis embaixo.
   Fontes: San Francisco quando o aparelho for Apple (-apple-system), Inter como alternativa no Android;
   Roboto 700 só no logotipo. Visual de referência Apple: cards translúcidos sem blur, cantos grandes,
   relógio ultrafino, anéis grossos no estilo Atividade. Cores: laranja #f8661d e grafite #1c2722. */
:root{
  --bg:#0f1512; --card:rgba(244,242,236,.06); --card-2:#26332c; --line:rgba(250,249,246,.09);
  --ink:#f4f2ec; --muted:#93a097;
  --accent:#f8661d; --accent-hi:#ffa066; --on-accent:#1c2722;
  --good:#3ddc97; --warn:#ffd23f; --bad:#ff4d6a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(75% 95% at 14% 0%,rgba(248,102,29,.20),transparent 62%),radial-gradient(60% 80% at 100% 100%,rgba(255,160,102,.08),transparent 60%),var(--bg);
  color:var(--ink);
  display:grid; place-items:center; overflow:hidden;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.stage{
  container-type:size;
  width:min(100vw,calc(100vh*2.2222),1000px);
  aspect-ratio:20/9;
}
.panel{
  --k:1cqh;
  height:100%; display:grid;
  grid-template-columns:8fr 4fr; grid-template-rows:64fr 36fr;
  gap:calc(var(--k)*2);
  padding-block:calc(var(--k)*2);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  font:400 calc(var(--k)*3.8)/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
}
.card{
  min-width:0; min-height:0; position:relative; overflow:hidden;
  background:var(--card); border:1px solid var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  border-radius:calc(var(--k)*4.2); padding:calc(var(--k)*2.8);
}
.eyebrow{
  font-size:max(11px,calc(var(--k)*3)); font-weight:600; color:var(--muted);
}

/* Hora e clima, no padrão do Uttopya TV */
.now{
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  gap:calc(var(--k)*2.8); padding-top:calc(var(--k)*4);
  background:radial-gradient(120% 95% at 0% 0%,rgba(248,102,29,.30),transparent 62%),var(--card);
}
.logo{
  position:absolute; left:calc(var(--k)*2.8); top:calc(var(--k)*2.6);
  font:700 calc(var(--k)*6.2)/1 Roboto,Arial,sans-serif;
  letter-spacing:-.042857em; white-space:nowrap; color:var(--ink);
}
.chip{
  position:absolute; right:calc(var(--k)*2.8); top:calc(var(--k)*2.6);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.06);
  color:var(--muted);font-size:max(10px,calc(var(--k)*2.5));
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);display:block;flex:none}
.date{font-size:calc(var(--k)*3.9);font-weight:500;letter-spacing:.005em}
.clock{
  all:unset; cursor:pointer; display:block;
  font-size:calc(var(--k)*21); font-weight:200; line-height:1; letter-spacing:-.025em;
}
.clock:focus-visible{outline:2px solid var(--accent-hi);outline-offset:4px;border-radius:6px}
.wx{
  display:inline-flex; align-items:center; gap:calc(var(--k)*2.4);
  max-width:100%; padding:calc(var(--k)*1.8) calc(var(--k)*3.8);
  border-radius:999px; background:rgba(244,242,236,.10); border:1px solid rgba(244,242,236,.12);
  text-align:left; font-size:max(11px,calc(var(--k)*3.2)); line-height:1.3;
}
.wxi{width:calc(var(--k)*6);height:calc(var(--k)*6);min-width:18px;min-height:18px;fill:currentColor;flex:none}
.wxt{font-size:calc(var(--k)*7.4);font-weight:300;line-height:1;letter-spacing:-.02em}
.wxg{display:flex;flex-direction:column;white-space:nowrap}
.wxg b{font-weight:500}
.wxg span{display:flex;gap:.6em;opacity:.85}
.wxg i{font-style:normal}
.sep{width:1px;align-self:stretch;background:rgba(244,242,236,.22);flex:none}
.hud{
  position:absolute; right:calc(var(--k)*2.8); top:calc(var(--k)*9);
  background:var(--card-2); border:1px solid var(--line); border-radius:8px;
  padding:3px 8px; white-space:pre; text-align:right;
  font:500 max(10px,calc(var(--k)*2.6))/1.3 ui-monospace,Menlo,monospace; color:var(--accent-hi);
}

/* Música (compacta) */
.music{
  display:flex;flex-direction:column;justify-content:center;gap:calc(var(--k)*3.4);
  padding:calc(var(--k)*2.6);
  background:radial-gradient(100% 120% at 100% 0%,rgba(255,160,102,.14),transparent 58%),var(--card);
}
.track{display:flex;gap:calc(var(--k)*2.6);align-items:center;min-width:0}
.cover{
  flex:none; width:calc(var(--k)*16); height:calc(var(--k)*16); border-radius:calc(var(--k)*2.2);
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 55%,#6b2a10);
}
.tinfo{min-width:0}
.ttitle{font-size:calc(var(--k)*4.6);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:calc(var(--k)*.4)}
.tartist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:max(11px,calc(var(--k)*3.2))}
.bar{display:flex;align-items:center;gap:calc(var(--k)*1.8);color:var(--muted);font-size:max(10px,calc(var(--k)*2.6))}
.rail{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent-hi),var(--accent));transform-origin:left center;transform:scaleX(0)}
.ctl{display:flex;align-items:center;justify-content:center;gap:calc(var(--k)*1.6)}
.btns{display:flex;align-items:center;gap:calc(var(--k)*.8)}
.btn{all:unset;cursor:pointer;display:grid;place-items:center;min-width:44px;min-height:44px;border-radius:50%;color:var(--muted)}
.btn:active{background:rgba(255,255,255,.08)}
.btn:focus-visible{outline:2px solid var(--accent-hi)}
.btn svg{width:calc(var(--k)*5);height:calc(var(--k)*5);min-width:18px;min-height:18px;fill:currentColor}
.btn.play{background:var(--accent);color:var(--on-accent)}
.btn.play:active{background:var(--accent-hi)}

/* Anéis */
.rings{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--k)*2);min-height:0}
.ring{
  min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);border-radius:calc(var(--k)*4.2);
  padding:calc(var(--k)*2) calc(var(--k)*1.6);
}
.rh{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.ring.warn .dot{background:var(--warn)}
.ring.hot .dot{background:var(--bad)}
.ring svg{height:calc(var(--k)*16);width:auto;max-width:100%}
.ring .trk{fill:none;stroke:rgba(248,102,29,.2);stroke-width:7}
.ring.warn .trk{stroke:rgba(255,210,63,.2)}
.ring.hot .trk{stroke:rgba(255,77,106,.2)}
.ring .val{
  fill:none;stroke:url(#g);stroke-width:7;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:32px 32px;
  transition:stroke-dashoffset .6s ease;
}
.ring.warn .val{stroke:var(--warn)}
.ring.hot .val{stroke:var(--bad)}
.ring text{fill:var(--ink);font:600 15px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;letter-spacing:-.02em}
.rd{color:var(--muted);font-size:max(10px,calc(var(--k)*2.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

@media (orientation:portrait){
  html,body{height:auto}
  body{display:block;overflow-x:hidden;overflow-y:auto}
  .stage{width:100%;aspect-ratio:auto;container-type:inline-size}
  .panel{--k:.62cqw;height:auto;grid-template-columns:1fr;grid-template-rows:none}
  .now{padding-top:calc(var(--k)*16);gap:calc(var(--k)*3)}
  .wx{flex-wrap:wrap;justify-content:center;border-radius:calc(var(--k)*6);row-gap:calc(var(--k)*2)}
  .sep{display:none}
  .rings{grid-template-columns:repeat(2,1fr)}
  .ring{gap:calc(var(--k)*2);padding-block:calc(var(--k)*3)}
  .ring:last-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa066"/><stop offset="1" stop-color="#f8661d"/>
    </linearGradient>
  </defs>
</svg>

<div class="stage">
<main class="panel">
  <section class="card now">
    <span class="logo" role="img" aria-label="Uttopya">uttopya</span>
    <span class="chip"><i class="dot"></i><span id="stale">–</span></span>
    <div id="date" class="date"></div>
    <button id="clock" class="clock" type="button" aria-label="Mostrar ou ocultar medidores de teste">--:--</button>
    <div class="wx" aria-label="Clima">
      <svg id="wxi" class="wxi" viewBox="0 0 24 24" aria-hidden="true"></svg>
      <span id="wxt" class="wxt">–</span>
      <span class="wxg"><b id="wxd">–</b><span><i id="wxmax">–</i><i id="wxmin">–</i></span></span>
      <i class="sep"></i>
      <span class="wxg"><b id="wxf">–</b><span id="wxh">–</span></span>
      <i class="sep"></i>
      <span class="wxg"><b id="wxc">–</b><span id="wxv">–</span></span>
    </div>
    <div id="hud" class="hud" hidden></div>
  </section>

  <section class="card music" aria-label="Música">
    <div class="track">
      <div class="cover" aria-hidden="true"></div>
      <div class="tinfo">
        <div class="eyebrow">Spotify · exemplo</div>
        <div id="ttitle" class="ttitle">–</div>
        <div id="tartist" class="tartist">–</div>
      </div>
    </div>
    <div class="bar"><span id="tpos">0:00</span><div class="rail"><div id="fill" class="fill"></div></div><span id="tdur">0:00</span></div>
    <div class="ctl">
      <div class="btns">
        <button id="prev" class="btn" type="button" aria-label="Faixa anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="play" class="btn play" type="button" aria-label="Pausar"><svg viewBox="0 0 24 24"><path id="playicon" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
        <button id="next" class="btn" type="button" aria-label="Próxima faixa"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
      </div>
    </div>
  </section>

  <section id="rings" class="rings" aria-label="Recursos do servidor e do Drive"></section>
</main>
</div>

<script>
(function(){
'use strict';
/* Contrato do futuro GET /api/state (JSON). Este arquivo não contém nenhum token:
   quando o backend existir, só fetchState() muda. */
var REFRESH_MS = 5000;            /* no painel real: 30000 */
var C = 2*Math.PI*26;
var $ = function(s){ return document.querySelector(s); };
var nf = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});

var RINGS = [
  {k:'cpu',    name:'CPU'},
  {k:'ram',    name:'RAM'},
  {k:'disk',   name:'Disco'},
  {k:'inodes', name:'Inodes'},
  {k:'drive',  name:'Drive'}
];
$('#rings').innerHTML = RINGS.map(function(r){
  return '<div class="ring" id="ring-'+r.k+'">'+
    '<div class="rh"><span class="eyebrow">'+r.name+'</span><i class="dot"></i></div>'+
    '<svg viewBox="0 0 64 64" aria-hidden="true"><circle class="trk" cx="32" cy="32" r="26"/>'+
    '<circle class="val" cx="32" cy="32" r="26" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+C.toFixed(2)+'"/>'+
    '<text x="32" y="33" text-anchor="middle" dominant-baseline="central">–</text></svg>'+
    '<div class="rd">–</div></div>';
}).join('');

/* ---- ícones de clima (24x24, preenchidos) ---- */
var WX_ICONS = {
  cloud:'<path d="M7 19h10a4.5 4.5 0 0 0 .7-8.95A6 6 0 0 0 6.2 9.6 4.7 4.7 0 0 0 7 19z"/>',
  sun:'<circle cx="12" cy="12" r="4.2"/><path d="M11 2h2v3h-2zM11 19h2v3h-2zM2 11h3v2H2zM19 11h3v2h-3zM4.9 6.3l1.4-1.4 2.1 2.1-1.4 1.4zM15.6 17l1.4-1.4 2.1 2.1-1.4 1.4zM4.9 17.7l2.1-2.1 1.4 1.4-2.1 2.1zM15.6 7l2.1-2.1 1.4 1.4L17 8.4z"/>',
  rain:'<path d="M7 15h10a4.5 4.5 0 0 0 .7-8.95A6 6 0 0 0 6.2 5.6 4.7 4.7 0 0 0 7 15z"/><path d="M7 17l-1 3h1.6l1-3zM11.5 17l-1 3h1.6l1-3zM16 17l-1 3h1.6l1-3z"/>',
  storm:'<path d="M7 15h10a4.5 4.5 0 0 0 .7-8.95A6 6 0 0 0 6.2 5.6 4.7 4.7 0 0 0 7 15z"/><path d="M12.8 14l-3 4.6h2.4L11 22l3.8-5.2h-2.5z"/>'
};

/* ---- dados simulados (clima copiado do Uttopya TV, só como exemplo) ---- */
var sim = {cpu:23, ram:2.3, disk:33, inodes:1.7, drive:11.4};
var TOTAL = {ram:4, disk:80, inodes:5.2, drive:15};
function drift(v,min,max,step){ return Math.min(max,Math.max(min,v+(Math.random()-.5)*step)); }
function fetchState(){
  sim.cpu = drift(sim.cpu,4,96,22);
  sim.ram = drift(sim.ram,1.2,3.8,.4);
  sim.disk = drift(sim.disk,30,36,.3);
  sim.inodes = drift(sim.inodes,1.5,2,.02);
  sim.drive = drift(sim.drive,11,12,.02);
  return Promise.resolve({
    at: Date.now(),
    weather:{icon:'cloud',temp:21,desc:'Nublado',max:30,min:20,feels:24,humidity:96,rainPct:100,windKmh:7},
    tencent:{
      cpuPct: sim.cpu,
      ram:{used:sim.ram,total:TOTAL.ram},
      disk:{used:sim.disk,total:TOTAL.disk},
      inodes:{used:sim.inodes,total:TOTAL.inodes}
    },
    drive:{used:sim.drive,total:TOTAL.drive}
  });
}

function setRing(k,pct,detail){
  var el = $('#ring-'+k), p = Math.max(0,Math.min(100,pct));
  el.querySelector('.val').style.strokeDashoffset = (C*(1-p/100)).toFixed(2);
  el.classList.toggle('hot', p>=85);
  el.classList.toggle('warn', p>=70 && p<85);
  el.querySelector('text').textContent = Math.round(p)+'%';
  el.querySelector('.rd').textContent = detail;
}
function pct(o){ return o.used/o.total*100; }
function renderWeather(w){
  $('#wxi').innerHTML = WX_ICONS[w.icon] || WX_ICONS.cloud;
  $('#wxt').textContent = Math.round(w.temp)+'°';
  $('#wxd').textContent = w.desc;
  $('#wxmax').textContent = 'Máx. '+Math.round(w.max)+'°';
  $('#wxmin').textContent = 'Mín. '+Math.round(w.min)+'°';
  $('#wxf').textContent = 'Sensação '+Math.round(w.feels)+'°';
  $('#wxh').textContent = 'Umidade '+Math.round(w.humidity)+'%';
  $('#wxc').textContent = 'Chuva '+Math.round(w.rainPct)+'%';
  $('#wxv').textContent = 'Vento '+Math.round(w.windKmh)+' km/h';
}
function render(s){
  var t = s.tencent;
  renderWeather(s.weather);
  setRing('cpu', t.cpuPct, 'Tencent');
  setRing('ram', pct(t.ram), nf.format(t.ram.used)+' / '+nf.format(t.ram.total)+' GB');
  setRing('disk', pct(t.disk), nf.format(t.disk.used)+' / '+nf.format(t.disk.total)+' GB');
  setRing('inodes', pct(t.inodes), nf.format(t.inodes.used)+' / '+nf.format(t.inodes.total)+' mi');
  setRing('drive', pct(s.drive), nf.format(s.drive.used)+' / '+nf.format(s.drive.total)+' GB');
  $('#stale').textContent = 'teste · '+new Date(s.at).toLocaleTimeString('pt-BR');
}
function refresh(){
  if(document.hidden) return;
  fetchState().then(render).catch(function(){ $('#stale').textContent = 'sem conexão'; });
}

/* ---- relógio e música (simulada) ---- */
var TRACKS = [
  {t:'Faixa de exemplo',a:'Artista de exemplo',d:214},
  {t:'Segunda faixa',a:'Outro artista',d:187},
  {t:'Terceira faixa',a:'Artista três',d:243}
];
var ti = 0, pos = 62, playing = true, last = performance.now(), lastMin = -1;
function fmt(s){ s = Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function renderTrack(){
  var tr = TRACKS[ti];
  $('#ttitle').textContent = tr.t; $('#tartist').textContent = tr.a; $('#tdur').textContent = fmt(tr.d);
}
function renderPlay(){
  $('#playicon').setAttribute('d', playing ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5v14l11-7z');
  $('#play').setAttribute('aria-label', playing ? 'Pausar' : 'Tocar');
}
function tick(){
  if(document.hidden) return;
  var now = performance.now();
  if(playing){
    pos += (now-last)/1000;
    if(pos >= TRACKS[ti].d){ ti = (ti+1)%TRACKS.length; pos = 0; renderTrack(); }
  }
  last = now;
  $('#fill').style.transform = 'scaleX('+(pos/TRACKS[ti].d).toFixed(4)+')';
  $('#tpos').textContent = fmt(pos);
  var d = new Date(), m = d.getMinutes();
  if(m !== lastMin){
    lastMin = m;
    $('#clock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(m).padStart(2,'0');
    var ds = d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    $('#date').textContent = ds.charAt(0).toUpperCase()+ds.slice(1);
  }
}
$('#play').addEventListener('click',function(){ playing = !playing; last = performance.now(); renderPlay(); });
$('#next').addEventListener('click',function(){ ti = (ti+1)%TRACKS.length; pos = 0; renderTrack(); });
$('#prev').addEventListener('click',function(){ ti = (ti+TRACKS.length-1)%TRACKS.length; pos = 0; renderTrack(); });

/* ---- medidores de teste (toque no relógio) ---- */
var hud = $('#hud'), hudOn = false, raf = 0, frames = 0, t0 = 0;
function loop(t){
  frames++;
  if(t-t0 >= 1000){
    var mem = performance.memory ? Math.round(performance.memory.usedJSHeapSize/1048576)+' MB heap' : 'heap n/d';
    hud.textContent = Math.round(frames*1000/(t-t0))+' fps\n'+mem+'\n'+document.getElementsByTagName('*').length+' nós';
    frames = 0; t0 = t;
  }
  raf = requestAnimationFrame(loop);
}
$('#clock').addEventListener('click',function(){
  hudOn = !hudOn; hud.hidden = !hudOn;
  if(hudOn){ frames = 0; t0 = performance.now(); raf = requestAnimationFrame(loop); }
  else cancelAnimationFrame(raf);
});

/* ---- tela sempre acesa (se o navegador permitir) ---- */
var wl = null;
function keepAwake(){
  try{
    if('wakeLock' in navigator && !document.hidden){
      navigator.wakeLock.request('screen').then(function(l){ wl = l; l.addEventListener('release',function(){ wl = null; }); }).catch(function(){});
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){ last = performance.now(); keepAwake(); refresh(); tick(); }
});
addEventListener('pointerdown',keepAwake,{once:true});

renderTrack(); renderPlay(); keepAwake(); refresh(); tick();
setInterval(refresh, REFRESH_MS);
setInterval(tick, 1000);
})();
</script>
